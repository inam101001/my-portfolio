name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './my-portfolio/package-lock.json'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (local only for scan)
        uses: docker/build-push-action@v5
        with:
          context: ./my-portfolio
          file: ./my-portfolio/docker/Dockerfile
          load: true # Load into local docker runtime
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:scan-temp

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:scan-temp'
          format: 'table'
          exit-code: '0' # Don't fail build yet, but report issues
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./my-portfolio
          file: ./my-portfolio/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:latest
          cache-to: type=inline

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Bootstrap & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e

            # ── 1. Install Docker if not present ──────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "Docker not found – installing..."
              sudo dnf update -y
              sudo dnf install -y docker git
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
              # Install Docker Compose v2 plugin
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              # Also create docker-compose shim for legacy scripts
              echo '#!/bin/sh\nexec docker compose "$@"' | sudo tee /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              echo "Docker installed successfully."
            else
              echo "Docker already installed: $(docker --version)"
            fi

            # ── 2. Clone repo on first deploy, pull on subsequent ones ────
            APP_DIR="/home/$USER/app/my-portfolio"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "App directory not found – cloning repository..."
              mkdir -p /home/$USER/app
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              echo "Pulling latest code..."
              cd "$APP_DIR" && git pull origin main
            fi

            # ── 3. Deploy ─────────────────────────────────────────────────
            cd "$APP_DIR/my-portfolio"

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}

            # Login to DockerHub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker-compose pull nginx-app
            docker-compose up -d

            # Cleanup old images
            docker image prune -af --filter "until=24h"
            echo "Deployment complete."

      - name: Verify Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Waiting for service to stabilize..."
            sleep 15
            if curl -sf http://localhost > /dev/null 2>&1; then
              echo "✅ Success: Website is active on port 80."
            else
              echo "❌ Error: Healthcheck failed."
              docker logs portfolio-app --tail=50
              exit 1
            fi