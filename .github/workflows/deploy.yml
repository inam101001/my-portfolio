name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (local only for scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: true # Load into local docker runtime
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:scan-temp

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:scan-temp'
          format: 'table'
          exit-code: '0' # Don't fail build yet, but report issues
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/my-portfolio:latest
          cache-to: type=inline

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/app/my-portfolio
            
            # Export environment variables for Docker Compose
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}
            
            # Pull latest code and images
            git pull origin main
            docker-compose pull nginx-app
            
            # Restart with zero-ish downtime 
            docker-compose up -d
            
            # Cleanup old images to prevent disk space issues
            docker image prune -af --filter "until=24h"

      - name: Verify Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/app/my-portfolio
            echo "Waiting for service to stabilize..."
            sleep 10
            if curl -f -k https://localhost > /dev/null 2>&1; then
              echo "✅ Success: Website is active."
            else
              echo "❌ Error: Healthcheck failed."
              docker-compose logs --tail=50 nginx-app
              exit 1
            fi