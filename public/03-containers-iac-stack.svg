<svg xmlns="http://www.w3.org/2000/svg"
  width="480" height="260" viewBox="52 16 376 228"
  role="img" aria-label="Animated containers and infrastructure as code artifact">
  <defs>
    <symbol id="logo-docker" viewBox="0 0 640 512"><path d="M349.9 236.3h-66.1v-59.4h66.1v59.4zm0-204.3h-66.1v60.7h66.1V32zm78.2 144.8H362v59.4h66.1v-59.4zm-156.3-72.1h-66.1v60.1h66.1v-60.1zm78.1 0h-66.1v60.1h66.1v-60.1zm276.8 100c-14.4-9.7-47.6-13.2-73.1-8.4-3.3-24-16.7-44.9-41.1-63.7l-14-9.3-9.3 14c-18.4 27.8-23.4 73.6-3.7 103.8-8.7 4.7-25.8 11.1-48.4 10.7H2.4c-8.7 50.8 5.8 116.8 44 162.1 37.1 43.9 92.7 66.2 165.4 66.2 157.4 0 273.9-72.5 328.4-204.2 21.4.4 67.6.1 91.3-45.2 1.5-2.5 6.6-13.2 8.5-17.1l-13.3-8.9zm-511.1-27.9h-66v59.4h66.1v-59.4zm78.1 0h-66.1v59.4h66.1v-59.4zm78.1 0h-66.1v59.4h66.1v-59.4zm-78.1-72.1h-66.1v60.1h66.1v-60.1z"/></symbol>
    <symbol id="logo-kubernetes" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="37" fill="none" stroke="currentColor" stroke-width="7"/>
  <circle cx="50" cy="50" r="10" fill="currentColor"/>
  <g stroke="currentColor" stroke-width="7" stroke-linecap="round">
    <path d="M50 14v22"/><path d="M78 27L62 42"/><path d="M86 58l-22-4"/>
    <path d="M68 82L58 62"/><path d="M32 82l10-20"/><path d="M14 58l22-4"/><path d="M22 27l16 15"/>
  </g>
  <g fill="currentColor">
    <circle cx="50" cy="14" r="5"/><circle cx="78" cy="27" r="5"/><circle cx="86" cy="58" r="5"/>
    <circle cx="68" cy="82" r="5"/><circle cx="32" cy="82" r="5"/><circle cx="14" cy="58" r="5"/><circle cx="22" cy="27" r="5"/>
  </g>
</symbol>
    <symbol id="logo-terraform" viewBox="0 0 100 100">
  <g fill="currentColor">
    <path d="M15 18l25 14v29L15 47z"/><path d="M44 34l25 14v29L44 63z"/>
    <path d="M44 4l25 14v25L44 29z"/><path d="M73 50l18-10v29L73 79z"/>
  </g>
</symbol>
    <symbol id="logo-ansible" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="7"/>
  <path d="M31 72L50 26l20 46-20-18z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
</symbol>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8"
        flood-color="#111216" flood-opacity=".11"/>
    </filter>
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- isometric base -->
  <g>
    <polygon points="94,181 242,123 390,178 241,237"
      fill="rgba(251,251,252,.72)"
      stroke="rgba(17,18,22,.62)" stroke-width="1.4"/>
    <g stroke="rgba(17,18,22,.18)" stroke-width="1">
      <line x1="123" y1="169" x2="270" y2="226"/>
      <line x1="153" y1="157" x2="300" y2="214"/>
      <line x1="183" y1="145" x2="330" y2="202"/>
      <line x1="213" y1="133" x2="360" y2="190"/>
      <line x1="271" y1="134" x2="126" y2="191"/>
      <line x1="302" y1="146" x2="157" y2="203"/>
      <line x1="333" y1="158" x2="188" y2="215"/>
    </g>
  </g>

  <!-- vertical deployment bus -->
  <line x1="242" y1="45" x2="242" y2="191"
    stroke="#1f55ff" stroke-width="2.2" stroke-linecap="round"
    stroke-dasharray="7 8">
    <animate attributeName="stroke-dashoffset"
      values="0;-30" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- continuously moving deployment packet -->
  <circle cx="242" cy="192" r="5" fill="#1f55ff" filter="url(#blueGlow)">
    <animate attributeName="cy"
      values="192;158;124;90;54;42"
      keyTimes="0;.2;.4;.6;.85;1"
      dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;1;1;1;1;0"
      keyTimes="0;.08;.75;.9;.96;1"
      dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- side status indicators -->
  <g>
    <circle cx="145" cy="65" r="5" fill="#fa4c14">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="122" r="5" fill="#a7f000">
      <animate attributeName="r" values="4;7;4" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="177" r="5" fill="#00bc5d">
      <animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ansible layer -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4.2s" repeatCount="indefinite"/>
    <polygon points="205,170 242,155 279,170 242,185"
      fill="rgba(250,76,20,.18)" stroke="rgba(250,76,20,.68)" stroke-width="1.5"/>
    <polygon points="205,170 242,185 242,202 205,187"
      fill="rgba(250,76,20,.09)" stroke="rgba(250,76,20,.38)"/>
    <polygon points="242,185 279,170 279,187 242,202"
      fill="rgba(250,76,20,.12)" stroke="rgba(250,76,20,.42)"/>
    <circle cx="242" cy="170" r="22" fill="#fbfbfc" stroke="#111216" stroke-width="1.6"/>
    <circle cx="242" cy="170" r="25" fill="none" stroke="#fa4c14" stroke-width="2">
      <animate attributeName="r" values="22;31;22" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.6;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <use href="#logo-ansible" x="223" y="151" width="38" height="38" color="#111216"/>
    <line x1="215" y1="163" x2="269" y2="185"
      stroke="#fa4c14" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="212;237;212" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="244;272;244" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Terraform layer -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4.2s" begin=".35s" repeatCount="indefinite"/>
    <polygon points="205,132 242,117 279,132 242,147"
      fill="rgba(0,188,93,.17)" stroke="rgba(0,188,93,.68)" stroke-width="1.5"/>
    <polygon points="205,132 242,147 242,164 205,149"
      fill="rgba(0,188,93,.08)" stroke="rgba(0,188,93,.36)"/>
    <polygon points="242,147 279,132 279,149 242,164"
      fill="rgba(0,188,93,.11)" stroke="rgba(0,188,93,.40)"/>
    <circle cx="242" cy="132" r="22" fill="#fbfbfc" stroke="#7b46c5" stroke-width="1.6"/>
    <circle cx="242" cy="132" r="25" fill="none" stroke="#7b46c5" stroke-width="2">
      <animate attributeName="r" values="22;31;22" dur="3.4s" begin=".85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" dur="3.4s" begin=".85s" repeatCount="indefinite"/>
    </circle>
    <use href="#logo-terraform" x="222" y="112" width="40" height="40" color="#7b46c5"/>
    <line x1="215" y1="125" x2="269" y2="147"
      stroke="#00bc5d" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="212;237;212" dur="2.5s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="244;272;244" dur="2.5s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="2.5s" begin=".4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Kubernetes layer -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4.2s" begin=".7s" repeatCount="indefinite"/>
    <polygon points="205,94 242,79 279,94 242,109"
      fill="rgba(31,85,255,.17)" stroke="rgba(31,85,255,.70)" stroke-width="1.5"/>
    <polygon points="205,94 242,109 242,126 205,111"
      fill="rgba(31,85,255,.08)" stroke="rgba(31,85,255,.36)"/>
    <polygon points="242,109 279,94 279,111 242,126"
      fill="rgba(31,85,255,.12)" stroke="rgba(31,85,255,.42)"/>
    <circle cx="242" cy="94" r="22" fill="#fbfbfc" stroke="#3f6de0" stroke-width="1.6"/>
    <circle cx="242" cy="94" r="25" fill="none" stroke="#1f55ff" stroke-width="2">
      <animate attributeName="r" values="22;31;22" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 242 94" to="360 242 94" dur="8s" repeatCount="indefinite"/>
      <use href="#logo-kubernetes" x="222" y="74" width="40" height="40" color="#3f6de0"/>
    </g>
    <line x1="215" y1="87" x2="269" y2="109"
      stroke="#1f55ff" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="212;237;212" dur="2.5s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="244;272;244" dur="2.5s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="2.5s" begin=".8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Docker layer -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4.2s" begin="1.05s" repeatCount="indefinite"/>
    <polygon points="205,56 242,41 279,56 242,71"
      fill="rgba(31,85,255,.20)" stroke="rgba(31,85,255,.75)" stroke-width="1.5"/>
    <polygon points="205,56 242,71 242,88 205,73"
      fill="rgba(31,85,255,.09)" stroke="rgba(31,85,255,.38)"/>
    <polygon points="242,71 279,56 279,73 242,88"
      fill="rgba(31,85,255,.13)" stroke="rgba(31,85,255,.44)"/>
    <circle cx="242" cy="56" r="22" fill="#fbfbfc" stroke="#2096ed" stroke-width="1.6"/>
    <circle cx="242" cy="56" r="25" fill="none" stroke="#2096ed" stroke-width="2">
      <animate attributeName="r" values="22;31;22" dur="3.4s" begin="2.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" dur="3.4s" begin="2.55s" repeatCount="indefinite"/>
    </circle>
    <use href="#logo-docker" x="219" y="33" width="46" height="46"
      color="#2096ed" fill="#2096ed"/>
    <line x1="215" y1="49" x2="269" y2="71"
      stroke="#1f55ff" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x1" values="212;237;212" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="244;272;244" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>