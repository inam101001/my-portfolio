<svg xmlns="http://www.w3.org/2000/svg"
  width="480" height="260" viewBox="42 24 396 218"
  role="img" aria-label="Animated observability telemetry artifact">
  <defs>
    <symbol id="logo-prometheus" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="42" fill="currentColor"/>
  <path d="M27 58h46c-2 17-13 27-23 27S29 75 27 58z" fill="#fff"/>
  <path d="M50 19c2 15-8 17-1 29 4-6 13-10 11-23 12 12 16 28 8 37H33c-7-13-3-27 8-37-2 13 3 18 9 23 7-11-2-16 0-29z" fill="#fff"/>
</symbol>
    <symbol id="logo-grafana" viewBox="0 0 100 100">
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M18 54c0-24 20-42 44-37" stroke-width="10"/>
    <path d="M31 62c-2-15 10-28 25-29 12-1 23 6 27 17" stroke-width="9"/>
    <path d="M43 67c-2-8 4-15 12-16 7-1 14 4 15 11" stroke-width="8"/>
  </g>
  <circle cx="59" cy="67" r="8" fill="currentColor"/>
</symbol>
    <symbol id="logo-elastic" viewBox="0 0 100 100">
  <rect x="13" y="16" width="36" height="20" rx="10" fill="#00bc5d"/>
  <rect x="52" y="16" width="35" height="20" rx="10" fill="#a7f000"/>
  <rect x="13" y="40" width="52" height="20" rx="10" fill="#1f55ff"/>
  <rect x="68" y="40" width="19" height="20" rx="9" fill="#111216"/>
  <rect x="13" y="64" width="30" height="20" rx="10" fill="#fa4c14"/>
  <rect x="46" y="64" width="41" height="20" rx="10" fill="#c9364f"/>
</symbol>
    <symbol id="icon-cloudwatch" viewBox="0 0 100 100">
  <rect x="12" y="15" width="76" height="70" rx="14" fill="currentColor"/>
  <path d="M25 64l15-17 13 10 22-29" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="64" r="5" fill="#fff"/><circle cx="40" cy="47" r="5" fill="#fff"/><circle cx="53" cy="57" r="5" fill="#fff"/><circle cx="75" cy="28" r="5" fill="#fff"/>
</symbol>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8"
        flood-color="#111216" flood-opacity=".11"/>
    </filter>
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- isometric plane -->
  <polygon points="86,178 226,121 383,174 241,231"
    fill="rgba(251,251,252,.70)"
    stroke="rgba(17,18,22,.62)" stroke-width="1.4"/>
  <g stroke="rgba(17,18,22,.18)" stroke-width="1">
    <line x1="116" y1="166" x2="257" y2="222"/>
    <line x1="147" y1="153" x2="288" y2="210"/>
    <line x1="178" y1="140" x2="319" y2="197"/>
    <line x1="209" y1="127" x2="350" y2="184"/>
    <line x1="256" y1="129" x2="119" y2="184"/>
    <line x1="289" y1="141" x2="152" y2="196"/>
    <line x1="322" y1="153" x2="185" y2="208"/>
  </g>

  <!-- route lines -->
  <path id="routeCloud" d="M126 132 Q182 111 224 131"
    fill="none" stroke="rgba(250,76,20,.32)" stroke-width="2"/>
  <path id="routeElastic" d="M130 190 Q184 172 224 145"
    fill="none" stroke="rgba(0,188,93,.30)" stroke-width="2"/>
  <path id="routeGrafana" d="M257 139 Q308 114 351 122"
    fill="none" stroke="rgba(31,85,255,.30)" stroke-width="2"/>

  <!-- moving telemetry packets -->
  <circle r="5" fill="#fa4c14">
    <animateMotion dur="2.7s" repeatCount="indefinite"
      path="M126 132 Q182 111 224 131"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#00bc5d" filter="url(#blueGlow)">
    <animateMotion dur="3.1s" begin=".65s" repeatCount="indefinite"
      path="M130 190 Q184 172 224 145"/>
    <animate attributeName="opacity" values="0;1;1;0"
      dur="3.1s" begin=".65s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#1f55ff" filter="url(#blueGlow)">
    <animateMotion dur="2.9s" begin="1.25s" repeatCount="indefinite"
      path="M257 139 Q308 114 351 122"/>
    <animate attributeName="opacity" values="0;1;1;0"
      dur="2.9s" begin="1.25s" repeatCount="indefinite"/>
  </circle>

  <!-- Prometheus hub -->
  <g filter="url(#shadow)">
    <circle cx="240" cy="136" r="27" fill="#fbfbfc"
      stroke="#fa4c14" stroke-width="1.8"/>
    <circle cx="240" cy="136" r="32" fill="none"
      stroke="#1f55ff" stroke-width="2">
      <animate attributeName="r" values="30;45;30" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.45;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="136" r="32" fill="none"
      stroke="#00bc5d" stroke-width="2">
      <animate attributeName="r" values="30;52;30" dur="3.2s"
        begin="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.38;0" dur="3.2s"
        begin="1.05s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="136" r="32" fill="none"
      stroke="#a7f000" stroke-width="2">
      <animate attributeName="r" values="30;59;30" dur="3.2s"
        begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.38;0" dur="3.2s"
        begin="2.1s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 240 136" to="360 240 136" dur="7s" repeatCount="indefinite"/>
      <circle cx="240" cy="136" r="48" fill="none"
        stroke="rgba(31,85,255,.34)" stroke-width="2" stroke-dasharray="7 10"/>
      <line x1="240" y1="136" x2="288" y2="136"
        stroke="#1f55ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="288" cy="136" r="5" fill="#1f55ff" filter="url(#blueGlow)"/>
    </g>

    <circle r="5" fill="#a7f000">
      <animateMotion dur="4.1s" repeatCount="indefinite"
        path="M280 136
              A40 40 0 1 1 200 136
              A40 40 0 1 1 280 136"/>
    </circle>

    <use href="#logo-prometheus" x="220" y="116" width="40" height="40"
      color="#fa4c14"/>
  </g>

  <!-- CloudWatch node -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4s" repeatCount="indefinite"/>
    <circle cx="124" cy="132" r="30" fill="#fbfbfc"
      stroke="#fa4c14" stroke-width="1.8"/>
    <circle cx="124" cy="132" r="35" fill="none"
      stroke="rgba(250,76,20,.30)" stroke-width="2">
      <animate attributeName="r" values="32;39;32" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.55;.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <use href="#icon-cloudwatch" x="104" y="112" width="40" height="40"
      color="#fa4c14"/>
  </g>

  <!-- Elastic node -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4s" begin=".55s" repeatCount="indefinite"/>
    <circle cx="128" cy="190" r="30" fill="#fbfbfc"
      stroke="#f97316" stroke-width="1.8"/>
    <circle cx="128" cy="190" r="35" fill="none"
      stroke="rgba(249,115,22,.30)" stroke-width="2">
      <animate attributeName="r" values="32;39;32" dur="2.8s"
        begin=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.55;.15" dur="2.8s"
        begin=".7s" repeatCount="indefinite"/>
    </circle>
    <use href="#logo-elastic" x="108" y="170" width="40" height="40"/>
  </g>

  <!-- Grafana node -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -4;0 0" dur="4s" begin="1.1s" repeatCount="indefinite"/>
    <circle cx="352" cy="122" r="30" fill="#fbfbfc"
      stroke="#111216" stroke-width="1.8"/>
    <circle cx="352" cy="122" r="35" fill="none"
      stroke="rgba(17,18,22,.22)" stroke-width="2">
      <animate attributeName="r" values="32;39;32" dur="2.8s"
        begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".12;.45;.12" dur="2.8s"
        begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 352 122" to="360 352 122" dur="10s" repeatCount="indefinite"/>
      <use href="#logo-grafana" x="332" y="102" width="40" height="40"
        color="#f59e0b"/>
    </g>
  </g>
</svg>